# Production: DigitalOcean Droplet'da /opt/abu-tolib ichida ishlaydi.
# GitHub Actions bu faylni har deploy'da serverga ko'chiradi.
# Sirlar /opt/abu-tolib/.env faylida (namuna: .env.production.example).
name: abu-tolib

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      retries: 10

  api:
    image: ghcr.io/mehriddin-omon/abu-tolib-api:${API_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_URL: https://${DOMAIN}
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/mehriddin-omon/abu-tolib-web:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
